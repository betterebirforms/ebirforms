name: Something doesn't work
description: The app crashes, a button does nothing, a page looks broken, printing fails.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste your real TIN, name or a savefile with your data.** Use made-up values.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations: { required: true }
  - type: input
    id: form
    attributes:
      label: Form
      description: The form code, if it happened on a form (for example 1701Q or 2550Q).
  - type: dropdown
    id: system
    attributes:
      label: Your computer
      options: [macOS, Windows, Linux, Web version]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: App version
      description: The number in the file name you downloaded, for example 0.1.0.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
