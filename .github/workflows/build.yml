name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # BIR's official Offline eBIRForms Package (RMC No. 104-2026); its forms are bundled into every package
  BIR_ZIP_URL: https://bir-cdn.bir.gov.ph/BIR/pdf/Offline_eBIRForms_Package_v7.9.6.2.1.zip

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run gate

  # BIR's form tree, staged once (helpers, *.exe/dll/pdb, *.vbs and proxy.ini refused by stage-package.mjs)
  bir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y innoextract
      - run: npm ci
      # keep BIR's file name: stage-package.mjs reads the version (7.9.6.2.1) from it; the release notes still say 7.9.6.1
      - run: curl -fsSL -A "Mozilla/5.0" -o "$(basename "$BIR_ZIP_URL")" "$BIR_ZIP_URL"
      - run: npm run extract -- "$(basename "$BIR_ZIP_URL")"
      - run: node tool/stage-package.mjs
      - run: |
          want=$(basename "$BIR_ZIP_URL" | sed -E 's/.*_v(.*)\.zip/\1/')
          grep -qF "\"bir_version\": \"$want\"" src-tauri/package-bir/_package.json
      - uses: actions/upload-artifact@v4
        with: { name: package-bir, path: src-tauri/package-bir, include-hidden-files: true }

  package:
    needs: [gate, bir]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_target: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.rust_target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: package-bir, path: src-tauri/package-bir }
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: node tool/package.mjs --no-stage
      - uses: actions/upload-artifact@v4
        with: { name: "dist-${{ runner.os }}", path: dist-package/* }

  # a v* tag publishes a release with every platform's package
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/release-note.md, sparse-checkout-cone-mode: false }
      - uses: actions/download-artifact@v4
        with: { pattern: "dist-*", path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          body_path: .github/release-note.md   # the release page's install steps for each platform
          files: out/*
